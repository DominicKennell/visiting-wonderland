<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice in Wonderland - Room AR</title>
    <!-- Import the Google Model-Viewer component -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #050505;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #00ffff;
        }
        model-viewer {
            width: 100%;
            height: 80vh;
            background-color: #110022;
        }
        .ar-button {
            background: #9900cc;
            color: white;
            border: 2px solid #00ffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Model-viewer handles native Android Scene Viewer & WebXR seamlessly -->
    <model-viewer 
        src="your-wonderland-portal-model.glb" 
        ios-src="your-wonderland-portal-model.usdz"
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1">
        
        <button slot="ar-button" class="ar-button">
            Place Portal in Your Room
        </button>
    </model-viewer>

    <div style="font-size: 13px; margin-top: 10px; color: #888;">
        Tap "Place Portal" to spawn it on your physical floor and walk around it.
    </div>

</body>
</html>
