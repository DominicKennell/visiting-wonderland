<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hatter's Tea Party - Outdoor AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ffff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 15px;
            border: 2px solid #9900cc;
            text-align: center;
            z-index: 999;
            font-family: monospace;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui">Connecting to GPS... Walk toward the target spot!</div>

    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
        <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>
        
        <!-- Locked directly to your specified Hatter's Tea Party coordinates -->
        <a-entity id="hatters-table" gps-new-entity-place="latitude: 51.8187; longitude: -1.2874;" scale="3 3 3">
            <!-- The Tea Table -->
            <a-cylinder radius="1.5" height="0.2" color="#8b4513" position="0 0 0"></a-cylinder>
            <!-- Teacups -->
            <a-cylinder radius="0.3" height="0.5" color="#ffffff" position="-0.8 0.3 -0.8"></a-cylinder>
            <a-cylinder radius="0.3" height="0.5" color="#ffffff" position="0.8 0.3 0.8"></a-cylinder>
            <!-- Mad Hatter's Top Hat Centerpiece -->
            <a-cylinder radius="0.4" height="0.6" color="#111111" position="0 0.5 0"></a-cylinder>
            <a-box width="1.0" height="0.05" depth="1.0" color="#111111" position="0 0.22 0"></a-box>
        </a-entity>
    </a-scene>

    <script>
        const entity = document.getElementById('hatters-table');
        entity.addEventListener('loaded', () => {
            setInterval(() => {
                const dist = entity.getAttribute('distance');
                if (dist !== null) {
                    document.getElementById('ui').innerHTML = `Hatter's Tea Party Ahead!<br>Distance: <b>${Math.round(dist)} meters</b>`;
                }
            }, 1000);
        });
    </script>
</body>
</html>
