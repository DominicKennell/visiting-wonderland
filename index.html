<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alice in Wonderland - Outdoor Landmark AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ffff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 15px;
            border: 2px solid #9900cc;
            text-align: center;
            z-index: 999;
            font-family: monospace;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui">Acquiring GPS Signal...</div>

    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
        <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>
        
        <!-- Giant scale so it's impossible to miss even if coordinates shift slightly -->
        <a-entity id="wonderland-landmark" gps-new-entity-place="latitude: 0; longitude: 0;" scale="5 5 5">
            <!-- Huge Mad Tea Party Table -->
            <a-cylinder radius="2.0" height="0.3" color="#8b4513" position="0 0 0"></a-cylinder>
            <!-- Giant Teacups -->
            <a-cylinder radius="0.4" height="0.8" color="#ffffff" position="-1.0 0.5 -1.0"></a-cylinder>
            <a-cylinder radius="0.4" height="0.8" color="#ffffff" position="1.0 0.5 1.0"></a-cylinder>
            <!-- Glowing Cheshire/Mushroom Centerpiece -->
            <a-cone radius-bottom="0.8" height="1.2" color="#ff0066" position="0 0.7 0"></a-cone>
        </a-entity>
    </a-scene>

    <script>
        window.addEventListener('load', () => {
            const cameraEl = document.querySelector('[gps-new-camera]');
            const landmark = document.getElementById('wonderland-landmark');
            
            cameraEl.addEventListener('gps-camera-update-position', e => {
                const currentLat = e.detail.position.latitude;
                const currentLon = e.detail.position.longitude;
                
                // Drop the giant landmark precisely 10 meters ahead of your current standing spot
                const targetLat = currentLat + 0.00009; 
                const targetLon = currentLon;

                landmark.setAttribute('gps-new-entity-place', `latitude: ${targetLat}; longitude: ${targetLon};`);
                
                document.getElementById('ui.innerHTML, #ui').innerHTML = `Wonderland Active!<br>Look straight ahead for the giant table.`;
            }, { once: true });
        });
    </script>
</body>
</html>
