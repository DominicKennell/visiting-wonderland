<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alice in Wonderland - Compass Debug AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #9900cc;
            text-align: center;
            z-index: 999;
            font-family: monospace;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui">Waiting for GPS lock...</div>

    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
        <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>
        
        <!-- Added look-at component so the tea party always rotates toward you -->
        <a-entity id="tea-party" gps-new-entity-place="latitude: 0; longitude: 0;" scale="2 2 2" animation-mixer>
            <a-cylinder radius="1.0" height="0.15" color="#8b4513" position="0 0 0"></a-cylinder>
            <a-cylinder radius="0.15" height="0.3" color="#ffffff" position="-0.4 0.2 -0.4"></a-cylinder>
            <a-cylinder radius="0.15" height="0.3" color="#ffffff" position="0.4 0.2 0.4"></a-cylinder>
            <a-cone radius-bottom="0.4" height="0.5" color="#ff0066" position="0 0.3 0"></a-cone>
        </a-entity>
    </a-scene>

    <script>
        window.addEventListener('load', () => {
            const cameraEl = document.querySelector('[gps-new-camera]');
            const entity = document.getElementById('tea-party');
            
            cameraEl.addEventListener('gps-camera-update-position', e => {
                const currentLat = e.detail.position.latitude;
                const currentLon = e.detail.position.longitude;
                
                // Spawn 15 meters directly East (+ longitude) so it's a clear distance away
                const targetLat = currentLat;
                const targetLon = currentLon + 0.00015; 

                entity.setAttribute('gps-new-entity-place', `latitude: ${targetLat}; longitude: ${targetLon};`);
                
                document.getElementById('ui').innerHTML = `GPS Locked!<br>Target set 15m away. Scan around slowly.`;
            }, { once: true });

            // Log distance changes to check tracking
            entity.addEventListener('loaded', () => {
                setInterval(() => {
                    const dist = entity.getAttribute('distance');
                    if(dist) {
                        document.getElementById('ui').innerHTML = `GPS Locked!<br>Tea Party is ${Math.round(dist)}m away.`;
                    }
                }, 1000);
            });
        });
    </script>
</body>
</html>
