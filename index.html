<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alice in Wonderland - GPS Outdoor AR</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js Location-Based build -->
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #info-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #9900cc;
            text-align: center;
            z-index: 999;
            pointer-events: none;
            width: 85%;
            max-width: 400px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="info-overlay">
        <b>Wonderland GPS Portal</b><br>Step outside, allow GPS permissions, and look around for the Mad Tea Party!
    </div>

    <a-scene 
        vr-mode-ui="enabled: false" 
        embedded 
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">

        <!-- GPS Camera tracks phone movement & orientation outdoor -->
        <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

        <!-- 
          The Mad Tea Party anchored to a specific GPS coordinate. 
          (REPLACE latitude and longitude with your target outdoor spot!)
        -->
        <a-entity gps-new-entity-place="latitude: 51.5074; longitude: -0.1278" scale="2 2 2">
            <!-- Tea Table -->
            <a-cylinder radius="1.2" height="0.15" color="#8b4513" position="0 0 0"></a-cylinder>
            <!-- Teacups -->
            <a-cylinder radius="0.2" height="0.4" color="#ffffff" position="-0.5 0.3 -0.5"></a-cylinder>
            <a-cylinder radius="0.2" height="0.4" color="#ffffff" position="0.5 0.3 0.5"></a-cylinder>
            <!-- Glowing Mushroom Centerpiece -->
            <a-cone radius-bottom="0.5" height="0.6" color="#ff0066" position="0 0.4 0"></a-cone>
        </a-entity>

    </a-scene>

</body>
</html>
