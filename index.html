<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alice in Wonderland - Magic Window Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            z-index: 10;
        }
        #instructions {
            background: rgba(0, 0, 0, 0.85);
            color: #00ffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            border: 1px solid #9900cc;
            text-shadow: 0 0 5px #00ffff;
            pointer-events: auto;
            cursor: pointer;
        }
        #site-hud {
            display: none;
            background: rgba(153, 0, 204, 0.85);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="instructions">Tap here to enable motion & peer through the Wonderland Portal</div>
        <div id="site-hud">Site: The Mad Tea Party</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls;
        let portalGroup, wonderlandGroup;
        let isInsideWonderland = false;
        
        const raycaster = new THREE.Raycaster();
        const touchPos = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x00ffff, 1.5);
            directionalLight.position.set(1, 4, 2);
            scene.add(directionalLight);

            // Setup controls (Gyroscope for mobile, Orbit for desktop fallback)
            if (window.DeviceOrientationEvent) {
                controls = new DeviceOrientationControls(camera);
            } else {
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
            }

            // Enable motion permission request for iOS/Android browsers
            document.getElementById('instructions').addEventListener('click', () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            controls = new DeviceOrientationControls(camera);
                        }
                    }).catch(console.error);
                }
                if (!isInsideWonderland) {
                    document.getElementById('instructions').style.display = 'none';
                }
            });

            buildWonderlandEnvironment();
            createPortal();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onScreenClick);
        }

        function createPortal() {
            portalGroup = new THREE.Group();

            // Portal Frame
            const frameGeo = new THREE.TorusGeometry(1.2, 0.1, 16, 100);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x9900cc, metalness: 0.8, roughness: 0.2 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            portalGroup.add(frame);

            // Portal Gateway Plane
            const portalInnerGeo = new THREE.CircleGeometry(1.15, 32);
            const portalInnerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
            const portalPlane = new THREE.Mesh(portalInnerGeo, portalInnerMat);
            portalPlane.name = "PortalGateway";
            portalGroup.add(portalPlane);

            portalGroup.position.set(0, 0, -3);
            scene.add(portalGroup);
        }

        function buildWonderlandEnvironment() {
            wonderlandGroup = new THREE.Group();
            wonderlandGroup.visible = false;

            // Sky Dome
            const skyGeo = new THREE.SphereGeometry(40, 32, 32);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x1a0033, side: THREE.BackSide });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            wonderlandGroup.add(sky);

            // Mad Tea Party Table
            const tableGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x996633 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.set(0, 0.5, -4);
            wonderlandGroup.add(table);

            // Teacups
            const cupGeo = new THREE.CylinderGeometry(0.2, 0.15, 0.4, 16);
            const cupMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for (let i = 0; i < 4; i++) {
                const cup = new THREE.Mesh(cupGeo, cupMat);
                const angle = (i / 4) * Math.PI * 2;
                cup.position.set(Math.cos(angle) * 0.8, 0.75, -4 + Math.sin(angle) * 0.8);
                wonderlandGroup.add(cup);
            }

            // Mushrooms
            const capGeo = new THREE.ConeGeometry(0.8, 0.4, 16);
            const stemGeo = new THREE.CylinderGeometry(0.2, 0.25, 1.0, 16);
            const capMat = new THREE.MeshStandardMaterial({ color: 0xff0066, roughness: 0.3 });
            const stemMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });

            const offsets = [{x: -3, z: -5}, {x: 3, z: -6}, {x: -2, z: -8}, {x: 3.5, z: -4}];
            offsets.forEach(pos => {
                const mush = new THREE.Group();
                const c = new THREE.Mesh(capGeo, capMat);
                c.position.y = 0.7;
                const s = new THREE.Mesh(stemGeo, stemMat);
                s.position.y = 0.2;
                mush.add(c);
                mush.add(s);
                mush.position.set(pos.x, 0, pos.z);
                wonderlandGroup.add(mush);
            });

            scene.add(wonderlandGroup);
        }

        function onScreenClick(event) {
            if (!isInsideWonderland) {
                touchPos.x = (event.clientX / window.innerWidth) * 2 - 1;
                touchPos.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(touchPos, camera);
                const intersects = raycaster.intersectObjects(portalGroup.children);
                
                if (intersects.length > 0 && intersects[0].object.name === "PortalGateway") {
                    enterWonderland();
                }
            }
        }

        function enterWonderland() {
            isInsideWonderland = true;
            portalGroup.visible = false;
            wonderlandGroup.visible = true;
            camera.position.set(0, 1.6, 0); // Step inside the world
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('site-hud').style.display = "block";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
