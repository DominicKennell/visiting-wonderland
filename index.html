<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vanilla WebXR Portal</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; font-family: sans-serif; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 18px;
            background: #4a0e4e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 999;
        }
    </style>
</head>
<body>

    <button id="ar-button">Start Wonderland AR</button>

    <script>
        let xrSession = null;
        let xrViewerSpace = null;
        let xrHitTestSource = null;
        let gl = null;
        let canvas = null;

        const button = document.getElementById('ar-button');

        // Check if WebXR with AR is supported by the mobile browser
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (supported) {
                    button.addEventListener('click', toggleAR);
                } else {
                    button.textContent = 'AR Not Supported on this Device';
                    button.disabled = true;
                }
            });
        } else {
            button.textContent = 'WebXR Not Available';
            button.disabled = true;
        }

        async function toggleAR() {
            if (xrSession) {
                await xrSession.end();
                return;
            }

            try {
                // Request an immersive-ar session with hit-test capability
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test', 'local-floor']
                });

                button.style.display = 'none';
                
                // Create native WebGL context bound to the XR session
                canvas = document.createElement('canvas');
                document.body.appendChild(canvas);
                gl = canvas.getContext('webgl', { xrCompatible: true });

                await xrSession.updateRenderState({
                    baseLayer: new XRWebGLLayer(xrSession, gl)
                });

                xrViewerSpace = await xrSession.requestReferenceSpace('viewer');
                let localSpace = await xrSession.requestReferenceSpace('local-floor');

                // Set up hit source for placing objects on real-world surfaces
                xrHitTestSource = await xrSession.requestHitTestSource({ space: xrViewerSpace });

                xrSession.addEventListener('end', () => {
                    xrSession = null;
                    button.style.display = 'block';
                    if (canvas) canvas.remove();
                });

                xrSession.requestAnimationFrame(onXRFrame);

            } catch (err) {
                console.error('Failed to start AR session:', err);
                button.style.display = 'block';
            }
        }

        function onXRFrame(time, frame) {
            let session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            let pose = frame.getViewerPose(xrViewerSpace);
            if (pose) {
                let glLayer = session.renderState.baseLayer;
                
                gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
                gl.clearColor(0, 0, 0, 0); // Transparent background to show camera feed
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                // Native WebXR render loop goes here.
                // Without Three.js, you handle raw WebGL draw calls, shader programs, 
                // and matrices directly for your Wonderland portal geometry.
            }
        }
    </script>
</body>
</html>
